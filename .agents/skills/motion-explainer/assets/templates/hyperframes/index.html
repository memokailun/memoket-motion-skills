<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>HyperFrames explainer scene</title>
    <!-- Fonts: local OFL files only. scripts/hf/prepare.mjs copies them from npm into fonts/ and writes the faces this
         page uses into the hf-local-fonts block below (the compiler only sees @font-face rules written in the html;
         a family it cannot see is fetched from Google Fonts and overrides the local files). Re-run after copy changes. -->
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <style id="hf-local-fonts">
/* generated by scripts/hf/prepare.mjs */
</style>
    <script src="./vendor/gsap.min.js"></script>
    <script src="./assets/timing.js"></script>
    <style>
      /* House look "Fine Line": porcelain paper, Prussian ink, one vermilion, graphite for what the story sets aside */
      :root {
        --paper: #F2F2EE; --ink: #1A2433; --ink-soft: rgba(26, 36, 51, 0.64); --verm: #E4472B; --cap: #3B4453;
        --graphite: #6B727C; --serif: "Instrument Serif", serif; --sans: "Geist Variable", "Geist", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper);
        -webkit-font-smoothing: antialiased; font-kerning: normal; color: var(--ink); }
      #paper { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 1; }
      .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0px 0px; z-index: 2; }
      #ov { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
      #labels, #chrome, #caps { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #chrome { z-index: 3; } #caps { z-index: 4; }
      .lpos { position: absolute; white-space: nowrap; }
      .lab { white-space: nowrap; font-family: var(--serif); font-style: italic; font-size: 52px; line-height: 1; color: var(--ink); }
      .lab.roman { font-style: normal; } .lab.v { color: var(--verm); } .lab.graphite { color: var(--graphite); }
      .badge { position: absolute; right: 110px; top: 60px; white-space: nowrap;
        font-family: var(--sans); font-size: 30px; font-weight: 460; letter-spacing: 0.05em; line-height: 1.15;
        color: rgba(26, 36, 51, 0.68); padding: 6px 20px 8px; border: 2px solid rgba(26, 36, 51, 0.3); border-radius: 999px; }
      .cap { position: absolute; left: 0; width: 1920px; top: 946px; text-align: center; white-space: nowrap;
        font-family: var(--sans); font-size: 48px; font-weight: 420; line-height: 1.2; color: var(--cap); letter-spacing: -0.004em; opacity: 0; }
      .cap .w { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.17" data-width="1920" data-height="1080">
      <canvas id="paper" width="1920" height="1080"></canvas>
      <div id="cam" class="cam">
        <svg id="ov" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"></svg>
        <div id="labels"></div>
      </div>
      <div id="chrome"><div class="badge">illustration</div></div>
      <div id="caps"></div>
    </div>
    <script src="./js/scene.js"></script>
    <script>
      (function () {
        const tl = window.__build();
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;   // key = data-composition-id; scripts/hf/make_cut.mjs rewrites this registration
        tl.seek(0);
      })();
    </script>
  </body>
</html>
